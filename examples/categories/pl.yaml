# Przykladowy pakiet kategorii PO POLSKU (zero-shot, multilingual classifier)
# Skopiuj sekcje do swojego config.yaml albo traktuj jako osobny "category pack".
# Opis opcji to de facto prompty klasyfikacyjne - pisz je tak, zeby opcje sie
# od siebie ODROZNIALY (to czyta klasyfikator).

questions:
  rodzaj_zadania:
    type: choice
    instructions: "Co uzytkownik chce, zebym agent zrobil w najnowszej wiadomosci? Oceniaj w kontekscie rozmowy."
    options:
      kodowanie: "Pisanie, naprawa, refactor lub przegląd kodu; testy; CI/budowanie."
      ogolne: "Pytania, wyjasnienia, planowanie, burza mozgow, pisanie prozy."
      wizja: "Zadanie z obrazkami: zrzuty ekranu, diagramy, analiza zdjec, generowanie obrazow."
      dokumentacja: "Glownie o tekscie technicznym: README, docstringi, changelog, tutoriale."
  trudnosc:
    type: score
    instructions: "Jak duzej mocy modelu wymaga dobra odpowiedz? Skala zdefiniowana przez rozmiar modelu."
    levels:
      trywialna: "Powitania, jednowierszowe fakty, drobne edycje; model 2B ogarnia bez wysilku."
      latwa: "Zmiany w jednym pliku, powszechne pytania; maly lokalny model wystarczy."
      srednia: "Wiele plikow, jakies decyzje projektowe; potrzebny mocny model."
      trudna: "Wielomodulowe, architektoniczne, badawcze rozumowanie; najlepszy dostepny model."
  potrzebuje_subagenta:
    type: noul
    instructions: "Czy to zadanie powinno zostac oddelegowane subagentowi zamiast byc obsluzone w biezacej rozmowie?"
    true_means: "Niezalezne podzadania, przeszukiwanie duzej bazy kodu, lub praca ktora zalalaby kontekst rodzica."
    false_means: "Pojedyncza zmiana, krotkie Q&A, lub zadanie do ktorego rodzic juz ma kontekst."

