# jev-router-core — EXAMPLE config (copy and adapt; nothing here is required)
# ============================================================================
# The core is an interpreter of YOUR rules. This file shows every knob with a
# working example. PII gating, web routing, stickiness etc. are EXAMPLES of
# user-defined rules, not built-in behavior.

classifier:
  # System One–compatible endpoint. Self-hosted Kev, Laya, jeff, or Jev cloud.
  base_url: "http://localhost:8100"
  # Wire path appended to base_url. Kev/jeff/OpenJev use /v1/systemone.
  path: "/v1/systemone"
  model: "kev-4b"                # model alias accepted by the endpoint
  api_key_env: "ROUTER_CLASSIFIER_KEY"   # optional; env var holding the key
  timeout_ms: 2000
  # What to do when the classifier is unreachable:
  #   default_model -> route via fallback.default (log a warning)
  #   block         -> refuse to route, adapter keeps its current model
  down: "default_model"

state:
  # What the adapter sends as classifier "state": last N messages, capped.
  last_messages: 4
  max_tokens: 1500

# ---------------------------------------------------------------------------
# Questions asked of the classifier in ONE call (evaluated in parallel).
# Each question: type choice|score|noul, with user-written option descriptions.
# Option names are the wire format; descriptions are what the model reads.
# ---------------------------------------------------------------------------
questions:
  task_kind:
    type: choice
    instructions: "What is the user asking the agent to do in the latest message? Judge in the context of the conversation."
    options:
      coding: "Writing, fixing, refactoring, or reviewing code; tests; build/CI work."
      general: "Questions, explanations, planning, brainstorming, writing prose."
      vision: "The request involves images: screenshots, diagrams, photo analysis, image generation."
      # Add your own categories freely; every option needs a description that
      # separates it from its neighbours.
  difficulty:
    type: score
    instructions: "How much model capability does a good answer need? Scale defined by model size."
    levels:
      trivial: "Greetings, one-line facts, tiny edits; a 2B model handles it easily."
      easy: "Single-file changes, common questions; a small local model handles it."
      moderate: "Multi-file work, some design choices; needs a strong model."
      hard: "Cross-cutting, architectural, research-grade reasoning; best model available."
  needs_spawn:
    type: noul
    instructions: "Should this task be delegated to a subagent instead of handled in the current conversation?"
    true_means: "Independent subtasks, large codebase search, or work that would flood the parent context."
    false_means: "Single focused change, short Q&A, or work the parent already has context for."

# ---------------------------------------------------------------------------
# Lanes: ordered preference lists per outcome. First entry that exists in the
# harness's model registry (and passes auth) wins. Unresolvable entries are
# skipped, never guessed.
# ---------------------------------------------------------------------------
lanes:
  coding_trivial:
    - { model: "qwen3-4b-local", thinking: "off" }
  coding_easy:
    - { model: "qwen3-4b-local", thinking: "low" }
    - { model: "qwen3-32b-local", thinking: "low" }
  coding_moderate:
    - { model: "qwen3-32b-local", thinking: "medium" }
  coding_hard:
    - { model: "qwen3-32b-local", thinking: "high" }
    - { model: "cloud-frontier", thinking: "high" }
  general_trivial:
    - { model: "qwen3-4b-local", thinking: "off" }
  general_moderate:
    - { model: "qwen3-32b-local", thinking: "low" }
  general_hard:
    - { model: "qwen3-32b-local", thinking: "medium" }
  vision_any:
    - { model: "qwen-vl-7b-local", thinking: "off" }

# ---------------------------------------------------------------------------
# Rule DSL: when <field> <op> <value> -> action.
# Evaluated top-to-bottom; first match wins. Fields available:
#   task_kind, difficulty, needs_spawn, needs_spawn_prob, <any question name>,
#   confidence, prompt_tokens, has_images, harness ("pi"|"hermes"), session_turn
# Ops: == != > >= < <= in (value list)
# Actions:
#   lane: <name>            route to that lane
#   pin: {model, thinking}  force exact model (bypasses lane resolution)
#   veto_spawn: true        block a spawn attempt
#   force_spawn: true       request the adapter to delegate (adapter-dependent)
# ---------------------------------------------------------------------------
rules:
  # EXAMPLE PII rule (user-defined; delete or adapt freely):
  - name: keep-secrets-local
    when: { field: pii_prob, op: ">=", value: 0.5 }
    then: { pin: { model: "qwen3-32b-local", thinking: "medium" } }

  # EXAMPLE vision rule:
  - name: images-need-vision
    when: { field: has_images, op: "==", value: true }
    then: { lane: vision_any }

  # EXAMPLE spawn veto: trivial tasks never spawn
  - name: no-spawn-for-trivial
    when: { field: difficulty, op: "==", value: "trivial" }
    then: { veto_spawn: true }

  # Default: map (task_kind, difficulty) -> lane "<task>_<difficulty>"
  - name: default-mapping
    when: { field: task_kind, op: "!=", value: "unclear" }
    then: { lane_template: "{task_kind}_{difficulty}" }

fallback:
  # Used when no rule matched, classifier is down, or confidence is below floor.
  default: { model: "qwen3-32b-local", thinking: "medium" }
  confidence_floor: 0.5     # below this, treat classification as unreliable

spawn:
  enabled: true
  threshold: 0.7            # needs_spawn_prob >= threshold passes (phase 2/3)
  mode: veto                # veto | force (force requires phase-3 spike)
  max_parallel_children: 3
  confirm: false

stickiness:
  # EXAMPLE: keep the expensive model during a long conversation for cache reuse.
  enabled: true
  min_turns_before_downgrade: 3

log:
  path: "~/.jevrouter/decisions.jsonl"
  content: "full"           # full | hash | none  (full = prompt text stored)

server:
  host: "127.0.0.1"
  port: 8790
  protocol_version: 1
