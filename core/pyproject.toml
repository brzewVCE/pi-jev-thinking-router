[project]
name = "jevrouter"
version = "0.1.0"
description = "Harness-agnostic model routing decision engine (System One classifiers: Kev/Laya/Jev)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
jevrouter = "jevrouter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
